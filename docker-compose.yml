version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: hotel_nganha_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: hotel_booking
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tự động init database schema khi container chạy lần đầu
      - ./backend/prisma/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
